<section class="container py-5">
  <h2 class="text-center text-dark mb-4">Order Details</h2>
  <form id="orderForm" class="p-4 border rounded shadow-sm bg-light">
    <div class="row mb-3">
      <div class="col-md-6">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" id="name" class="form-control" required />
      </div>
      <div class="col-md-6">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" required />
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label for="address" class="form-label">Address</label>
        <input type="text" id="address" class="form-control" required />
      </div>
      <div class="col-md-6">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="tel" id="phone" class="form-control" required />
      </div>
    </div>

    <div class="mb-3">
      <label for="notes" class="form-label">Additional Notes</label>
      <textarea id="notes" class="form-control" rows="3" placeholder="Any special instructions?"></textarea>
    </div>

    <button type="submit" class="btn btn-primary w-100">Place Order</button>
  </form>
</section>
